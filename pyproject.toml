[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelcanvas"
version = "0.7.0"
description = "pixelcanvas: a command-line paint program an AI agent drives stage by stage (plan, sketch, line, flat, shade, detail, finish), with layers, undo and a view after every command"
readme = "docs/PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "treeleaves30760"}]
keywords = ["agent-skill", "claude-code", "opencode", "ai-agents", "paint", "drawing", "illustration", "redraw",
            "reference", "anime", "layers", "psd", "cli", "numpy", "opencv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=9.1", "opencv-python-headless", "scikit-image", "scipy"]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[project.urls]
Homepage = "https://github.com/treeleaves30760/pixelcanvas"
Repository = "https://github.com/treeleaves30760/pixelcanvas"
Issues = "https://github.com/treeleaves30760/pixelcanvas/issues"
Changelog = "https://github.com/treeleaves30760/pixelcanvas/blob/main/CHANGELOG.md"
Documentation = "https://github.com/treeleaves30760/pixelcanvas#readme"

[project.scripts]
pixelcanvas = "pixelcanvas.cli:main"

# Packages: setup.py finds pixelcanvas and adds pixelcanvas.skill, which is the folder
# skills/pixelcanvas of the checkout (the skill an agent reads). The wheel carries it as pixelcanvas/skill/, where
# `pixelcanvas install-skill` copies it from; a checkout keeps using skills/pixelcanvas unchanged.
[tool.setuptools.package-dir]
"pixelcanvas.skill" = "skills/pixelcanvas"

[tool.setuptools.package-data]
"pixelcanvas" = ["*.json"]
"pixelcanvas.skill" = ["*.md", "**/*.md", "**/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "**/__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
