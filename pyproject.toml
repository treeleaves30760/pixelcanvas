[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelcanvas"
version = "0.1.0"
description = "讓 Claude 用像素級運算畫圖 / 修圖的工具箱（numpy + Pillow）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=9.1"]

[project.optional-dependencies]
fast = ["scipy>=1.8"]
test = ["pytest"]

[project.scripts]
pixelcanvas = "pixelcanvas.cli:main"

[tool.setuptools]
packages = ["pixelcanvas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
