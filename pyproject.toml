[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelcanvas"
version = "0.3.0"
description = "Let AI models draw with code: pixel-level painting, typography and inspection tools for vision models (numpy + Pillow)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "treeleaves30760"}]
keywords = ["agent-skill", "claude-code", "codex", "ai-art", "procedural-generation", "image-generation",
            "text-to-image", "numpy", "pillow", "vlm", "poster", "typography", "psd", "layers"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=9.1"]

[project.optional-dependencies]
fast = ["scipy>=1.8"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/treeleaves30760/pixelcanvas"
Issues = "https://github.com/treeleaves30760/pixelcanvas/issues"

[project.scripts]
pixelcanvas = "pixelcanvas.cli:main"

[tool.setuptools]
packages = ["pixelcanvas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
