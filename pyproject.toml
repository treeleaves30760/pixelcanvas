[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelcanvas"
version = "0.3.0"
description = "Let AI models draw with code: pixel-level painting, typography and inspection tools for vision models (numpy + Pillow)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=9.1"]

[project.optional-dependencies]
fast = ["scipy>=1.8"]
test = ["pytest"]

[project.scripts]
pixelcanvas = "pixelcanvas.cli:main"

[tool.setuptools]
packages = ["pixelcanvas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
